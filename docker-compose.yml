version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: blackdoor_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blackdoor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

  backend:
    build: ./backend
    container_name: blackdoor_backend
    restart: always
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:password@db:5432/blackdoor
      - JWT_SECRET=supersecretjwtkey_blackdoor_2026
      - JWT_REFRESH_SECRET=supersecretjwtrefreshkey_blackdoor_2026
      - GOOGLE_CLIENT_ID=mock-google-client-id
      - GOOGLE_CLIENT_SECRET=mock-google-client-secret
      - TELEGRAM_BOT_TOKEN=8304799073:AAGOi1nbw29OkKY_YhrP3kOJnRGRVq-qVPY
      - TELEGRAM_BOT_USERNAME=Itcloudvertifikatsiya_bot
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: blackdoor_frontend
    restart: always
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_TELEGRAM_BOT_USERNAME=Itcloudvertifikatsiya_bot
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: blackdoor_nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
