version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: blackdoor_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blackdoor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Automatically initialize database schema and seed data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

  backend:
    build: ./backend
    container_name: blackdoor_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:password@db:5432/blackdoor
      - JWT_SECRET=supersecretjwtkey_blackdoor_2026
      - JWT_REFRESH_SECRET=supersecretjwtrefreshkey_blackdoor_2026
      - GOOGLE_CLIENT_ID=mock-google-client-id
      - GOOGLE_CLIENT_SECRET=mock-google-client-secret
      - TELEGRAM_BOT_TOKEN=mock-telegram-bot-token
      - TELEGRAM_BOT_USERNAME=blackdoor_2fa_bot
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: blackdoor_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
      - VITE_TELEGRAM_BOT_USERNAME=blackdoor_2fa_bot
    depends_on:
      - backend

volumes:
  pgdata:
